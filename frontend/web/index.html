<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raahat — Emergency Care Finder</title>
  <meta name="description" content="Find a Hyderabad hospital that can actually treat your injury, and understand what help you may be eligible for.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7c7b'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hand_finger" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
      <symbol id="i-fracture" viewBox="0 0 24 24"><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5 .5.5 0 0 1-.5-.5 2.5 2.5 0 1 0-5 0c0 .81.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 0 0 0 5c.28 0 .5.22.5.5a2.5 2.5 0 1 0 5 0c0-.81-.7-1.8 0-2.5Z"/></symbol>
      <symbol id="i-head_injury" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/><path d="M9 6.5l6 3"/></symbol>
      <symbol id="i-fall_polytrauma" viewBox="0 0 24 24"><path d="M12 3v14"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></symbol>
      <symbol id="i-burns" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
      <symbol id="i-deep_cut" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
      <symbol id="i-eye_injury" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-chest_pain" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-nav" viewBox="0 0 24 24"><path d="m3 11 19-9-9 19-2-8-8-2z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="#top" aria-label="Raahat">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z"/></svg></span>
        <span class="brand__name">Raahat</span>
      </a>
      <div class="topbar__actions">
        <a class="call-pill" href="tel:108"><svg class="ico"><use href="#i-phone"/></svg><span>108</span></a>
        <label class="lang">
          <span class="sr-only">Language</span>
          <select id="lang" aria-label="Language / भाषा / భాష / زبان"></select>
        </label>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero__grid">
        <div class="hero__copy">
          <p class="eyebrow"><span class="eyebrow__dot"></span><span data-i18n="caption"></span></p>
          <h1 class="hero__title"><span id="title-a"></span> <span id="title-b" class="accent"></span></h1>
          <p class="hero__sub" data-i18n="hero_sub"></p>

          <form id="describe-form" class="describe">
            <label for="describe-text" class="describe__label">
              <svg class="ico"><use href="#i-sparkle"/></svg>
              <span data-i18n="describe_header"></span>
            </label>
            <p class="describe__hint" data-i18n="describe_label"></p>
            <div class="describe__row">
              <textarea id="describe-text" rows="2" maxlength="1000" data-i18n-ph="describe_placeholder"></textarea>
              <button type="submit" class="btn btn--primary" id="describe-btn"><span data-i18n="understand_button"></span></button>
            </div>
          </form>
          <div id="understood" class="understood" aria-live="polite"></div>

          <div class="alert alert--emergency" role="note">
            <svg class="ico"><use href="#i-phone"/></svg>
            <span data-i18n-md="banner_108"></span>
            <a class="alert__call" href="tel:108">108</a>
          </div>
        </div>

        <aside class="preview" aria-label="Preview">
          <div class="preview__head">
            <span class="preview__title" data-i18n="preview_title"></span>
            <span class="preview__injury" id="preview-injury"></span>
          </div>
          <ol class="preview__list" id="preview-list"></ol>
          <div class="preview__foot">
            <svg class="ico"><use href="#i-shield"/></svg>
            <span id="preview-foot"></span>
          </div>
        </aside>
      </div>
    </section>

    <section class="container searchbar-wrap" aria-labelledby="find-title">
      <form id="search-form" class="searchbar card">
        <h2 id="find-title" class="sr-only" data-i18n="find_care"></h2>
        <label class="field">
          <span class="field__label" data-i18n="injury"></span>
          <select id="injury"></select>
        </label>
        <label class="field">
          <span class="field__label" data-i18n="location"></span>
          <select id="locality"></select>
        </label>
        <label class="field field--radius">
          <span class="field__label"><span data-i18n="radius"></span>: <b id="radius-val">20</b></span>
          <input id="radius" type="range" min="2" max="30" value="20">
        </label>
        <button type="submit" class="btn btn--primary btn--lg" id="search-btn"><span data-i18n="find_button"></span></button>
        <details class="coords">
          <summary data-i18n="exact_coords"></summary>
          <div class="coords__row">
            <label class="check"><input type="checkbox" id="use-coords"> <span data-i18n="override_coords"></span></label>
            <label class="field field--sm"><span class="field__label" data-i18n="latitude"></span><input id="lat" type="number" step="0.0001"></label>
            <label class="field field--sm"><span class="field__label" data-i18n="longitude"></span><input id="lng" type="number" step="0.0001"></label>
          </div>
        </details>
      </form>
    </section>

    <section class="container sources-band" aria-label="Sources">
      <span class="sources-band__label" data-i18n="grounded_in"></span>
      <ul id="sources-band" class="sources-band__list"></ul>
    </section>

    <section class="container section">
      <h2 class="section__title" data-i18n="how.title"></h2>
      <div class="how">
        <div class="how__item"><span class="how__num">01</span><h3 data-i18n="how.1.title"></h3><p data-i18n="how.1.body"></p></div>
        <div class="how__item"><span class="how__num">02</span><h3 data-i18n="how.2.title"></h3><p data-i18n="how.2.body"></p></div>
        <div class="how__item"><span class="how__num">03</span><h3 data-i18n="how.3.title"></h3><p data-i18n="how.3.body"></p></div>
      </div>
    </section>

    <section class="container section">
      <h2 class="section__title" data-i18n="injury"></h2>
      <div id="injury-tiles" class="tiles" role="list"></div>
    </section>

    <section class="stats">
      <div class="container stats__grid">
        <div class="stat"><b id="stat-injuries">8</b><span data-i18n="stat.injuries"></span></div>
        <div class="stat"><b id="stat-facilities">18</b><span data-i18n="stat.facilities"></span></div>
        <div class="stat"><b>4</b><span data-i18n="stat.languages"></span></div>
        <div class="stat"><b>4</b><span data-i18n="stat.sources"></span></div>
      </div>
    </section>

    <div class="container">
      <p class="demo-note" data-i18n="demo_warning"></p>
      <p id="start-info" class="empty" data-i18n="start_info"></p>
    </div>

    <section id="results" class="container section" hidden aria-live="polite">
      <div class="results__head">
        <h2 class="section__title" id="found"></h2>
        <p class="muted" data-i18n="tap_hint"></p>
      </div>
      <div class="metrics">
        <div class="metric"><span data-i18n="metric_specialists"></span><b id="m-specialists"></b></div>
        <div class="metric"><span data-i18n="metric_nearest"></span><b id="m-nearest"></b></div>
        <div class="metric"><span data-i18n="metric_empanelled"></span><b id="m-empanelled"></b></div>
      </div>

      <div id="next-steps" class="steps card"></div>

      <div class="results__grid">
        <div class="map-wrap card">
          <div id="map" dir="ltr"></div>
          <div class="legend" id="legend"></div>
        </div>
        <div>
          <h3 class="list-title" data-i18n="nearby"></h3>
          <ol id="facility-list" class="facility-list"></ol>
        </div>
      </div>
    </section>

    <section id="entitlements" class="container section" hidden>
      <div class="ent card">
        <div class="ent__form">
          <p class="eyebrow eyebrow--dark"><svg class="ico"><use href="#i-shield"/></svg><span data-i18n="eligible_header"></span></p>
          <p class="muted small" data-i18n="eligible_caption"></p>
          <form id="ent-form">
            <label class="field">
              <span class="field__label" data-i18n="hospital_select"></span>
              <select id="ent-facility"></select>
            </label>
            <fieldset class="field">
              <legend class="field__label" data-i18n="situations_q"></legend>
              <div id="chips" class="chips"></div>
              <p class="muted small" data-i18n="situations_help"></p>
            </fieldset>
            <label class="field">
              <span class="field__label" data-i18n="anything_else"></span>
              <textarea id="situation-text" rows="2" maxlength="500" data-i18n-ph="anything_placeholder"></textarea>
            </label>
            <button type="submit" class="btn btn--primary btn--lg" id="ent-btn"><span data-i18n="explain_button"></span></button>
          </form>
        </div>
        <div class="ent__result" id="ent-result" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p><b>Raahat</b> · <span data-i18n="caption"></span></p>
      <p class="small" data-i18n="demo_warning"></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
