services:
  - type: web
    name: raahat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Render asks for the value when the blueprint is created
      # Anonymous usage + feedback store. Render's free disk is wiped on every restart, so
      # without this the events only survive in the logs. A free Neon/Supabase Postgres URL works.
      - key: DATABASE_URL
        sync: false
      # Unlocks /api/admin/stats and /api/admin/events.csv (?token=...). Unset = both return 404.
      - key: ADMIN_TOKEN
        sync: false
